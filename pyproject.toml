[project]
name = "tp-mlops"
version = "0.1.0"
description = "Proyecto académico de MLOps para clasificación de objetos astronómicos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "lightgbm>=4.3,<5",
    "kagglehub>=0.3,<1",
    "jupyter>=1.0,<2",
    "ipykernel>=6.29,<7",
    "mlflow>=2.18,<3",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

